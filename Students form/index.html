<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #fff3cd;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 18px;
            border: 4px solid #4fc3f7;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #ff6f00;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .welcome {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        fieldset {
            border: 2px solid #81d4fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f5fcff;
        }

        legend {
            color: #0277bd;
            font-size: 18px;
            padding: 0 8px;
        }

        label {
            display: inline-block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 2px solid #b3e5fc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #ff9800;
            box-shadow: 0 0 5px rgba(255, 152, 0, 0.3);
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
            accent-color: #ff9800;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ff9800;
        }

        input[type="color"] {
            width: 70px;
            height: 45px;
            padding: 3px;
        }

        .option {
            margin: 9px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"] {
            background: #ff9800;
            color: white;
        }

        button[type="reset"] {
            background: #81d4fa;
            color: #17445c;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>🌈 Kids Registration Form</h2>

        <p class="welcome">
            Welcome, little explorer! 🚀 Fill in your details and join the fun!
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend><strong>👦 About Me</strong></legend>

                <label for="name">My Name:</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter your name" required><br><br>

                <label for="email">Parent's Email:</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter parent's email" required><br><br>

                <label for="age">My Age:</label>
                <input type="number" id="age" name="age"
                    min="5" max="15" placeholder="Enter your age"><br><br>

                <label for="dob">My Birthday:</label>
                <input type="date" id="dob" name="dob">

            </fieldset>

            <fieldset>
                <legend><strong>🧒 I Am</strong></legend>

                <div class="option">
                    <input type="radio" id="boy" name="gender" value="Boy">
                    <label for="boy">👦 Boy</label>
                </div>

                <div class="option">
                    <input type="radio" id="girl" name="gender" value="Girl">
                    <label for="girl">👧 Girl</label>
                </div>

            </fieldset>

            <fieldset>
                <legend><strong>⭐ Things I Like to Learn</strong></legend>

                <div class="option">
                    <input type="checkbox" id="drawing" name="skills" value="Drawing">
                    <label for="drawing">🎨 Drawing</label>
                </div>

                <div class="option">
                    <input type="checkbox" id="coding" name="skills" value="Coding">
                    <label for="coding">💻 Coding</label>
                </div>

                <div class="option">
                    <input type="checkbox" id="science" name="skills" value="Science">
                    <label for="science">🔬 Science</label>
                </div>

                <div class="option">
                    <input type="checkbox" id="music" name="skills" value="Music">
                    <label for="music">🎵 Music</label>
                </div>

            </fieldset>

            <fieldset>
                <legend><strong>📚 My Learning Details</strong></legend>

                <label for="course">My Favorite Subject:</label>
                <select id="course" name="course">
                    <option value="">-- Choose a Subject --</option>
                    <option value="Maths">🔢 Mathematics</option>
                    <option value="Science">🔬 Science</option>
                    <option value="English">📖 English</option>
                    <option value="Computer">💻 Computer</option>
                    <option value="Art">🎨 Art</option>
                </select>

                <br><br>

                <label for="city">My City:</label>
                <input list="cities" id="city" name="city"
                    placeholder="Type or select your city">

                <datalist id="cities">
                    <option value="Coimbatore">
                    <option value="Chennai">
                    <option value="Madurai">
                    <option value="Salem">
                    <option value="Trichy">
                </datalist>

            </fieldset>

            <fieldset>
                <legend><strong>🎯 My Preferences</strong></legend>

                <label for="rating">
                    How much do you like learning? ⭐
                </label>

                <input type="range" id="rating" name="rating"
                    min="1" max="10">

                <br><br>

                <label for="color">My Favorite Color:</label><br>
                <input type="color" id="color" name="color">

            </fieldset>

            <div class="buttons">
                <button type="submit">🚀 Join the Fun</button>
                <button type="reset">🔄 Clear</button>
            </div>

        </form>

    </div>

</body>

</html>
